<text x="150.0" y="850.0" font-size="23" fill="#4b5661">Het percentage is het deel van het verbruik uit eigen zonnestroom. * juni vanaf de plaatsing, oktober tot en met 18 oktober.</text>
<text x="150.0" y="880.0" font-size="23" fill="#4b5661">Meetwaarden van één woning, maandwaarden afgelezen uit de monitoringapp en afgerond op 10 kWh.</text>
