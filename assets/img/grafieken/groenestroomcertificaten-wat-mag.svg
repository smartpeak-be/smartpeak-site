<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Instrument Sans, Segoe UI, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="150" y="82" font-size="40" font-weight="650" fill="#1f272e">Groenestroomcertificaten: wat mag je veranderen?</text>
<text x="150" y="128" font-size="27" fill="#4b5661">Wat er mag aan een installatie die nog groenestroomcertificaten krijgt</text>
<rect x="150" y="180" width="1300" height="112" rx="18" fill="#e9f8ef" stroke="#bfe9cf" stroke-width="3"/>
<text x="185.0" y="228.0" font-size="29" fill="#1f272e" font-weight="650">Thuisbatterij AC-gekoppeld</text>
<text x="185.0" y="268.0" font-size="22" fill="#4b5661">batterij met eigen omvormer, niet tussen omvormer en groenestroomteller</text>
<rect x="1150" y="210" width="270" height="52" rx="26" fill="#ffffff" stroke="#0b7a42" stroke-width="3"/>
<text x="1285.0" y="245.0" font-size="24" fill="#0b7a42" font-weight="650" text-anchor="middle">mag</text>
<rect x="150" y="308" width="1300" height="112" rx="18" fill="#e9f8ef" stroke="#bfe9cf" stroke-width="3"/>
<text x="185.0" y="356.0" font-size="29" fill="#1f272e" font-weight="650">Hybride omvormer + batterij</text>
<text x="185.0" y="396.0" font-size="22" fill="#4b5661">met bidirectionele groenestroomteller en nieuwe AREI-keuring</text>
<rect x="1150" y="338" width="270" height="52" rx="26" fill="#ffffff" stroke="#0b7a42" stroke-width="3"/>
<text x="1285.0" y="373.0" font-size="24" fill="#0b7a42" font-weight="650" text-anchor="middle">mag</text>
<rect x="150" y="436" width="1300" height="112" rx="18" fill="#e7f5f7" stroke="#b5dde3" stroke-width="3"/>
<text x="185.0" y="484.0" font-size="29" fill="#1f272e" font-weight="650">Omvormer vervangen, zonder batterij</text>
<text x="185.0" y="524.0" font-size="22" fill="#4b5661">nieuwe omvormer op de C10/26-lijst, max. 5 kVA (1-fase) of 10 kVA (3-fase)</text>
<rect x="1150" y="466" width="270" height="52" rx="26" fill="#ffffff" stroke="#0a6a78" stroke-width="3"/>
<text x="1285.0" y="501.0" font-size="24" fill="#0a6a78" font-weight="650" text-anchor="middle">enkel bij defect</text>
<rect x="150" y="564" width="1300" height="112" rx="18" fill="#e7f5f7" stroke="#b5dde3" stroke-width="3"/>
<text x="185.0" y="612.0" font-size="29" fill="#1f272e" font-weight="650">Defecte panelen vervangen</text>
<text x="185.0" y="652.0" font-size="22" fill="#4b5661">één op één, gelijkaardig paneel, met bewijs van het defect</text>
<rect x="1150" y="594" width="270" height="52" rx="26" fill="#ffffff" stroke="#0a6a78" stroke-width="3"/>
<text x="1285.0" y="629.0" font-size="24" fill="#0a6a78" font-weight="650" text-anchor="middle">onder voorwaarden</text>
<rect x="150" y="692" width="1300" height="112" rx="18" fill="#fdecea" stroke="#f3c7c0" stroke-width="3"/>
<text x="185.0" y="740.0" font-size="29" fill="#1f272e" font-weight="650">Panelen bijleggen</text>
<text x="185.0" y="780.0" font-size="22" fill="#4b5661">extra panelen enkel op een aparte omvormer, als nieuwe installatie</text>
<rect x="1150" y="722" width="270" height="52" rx="26" fill="#ffffff" stroke="#c2412d" stroke-width="3"/>
<text x="1285.0" y="757.0" font-size="24" fill="#c2412d" font-weight="650" text-anchor="middle">niet</text>
<text x="150.0" y="850.0" font-size="21" fill="#4b5661">Bron: Fluvius, aanpassingen aan je installatie zonnepanelen en toelichting PV-installatie (versie 2.0); AC-gekoppelde</text>
<text x="150.0" y="878.0" font-size="21" fill="#4b5661">batterij: Elektriciteitshuis (de regels van Fluvius zeggen daar niets over). Elke wijziging meld je in Mijn Fluvius.</text>
</svg>
