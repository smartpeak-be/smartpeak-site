<text x="570.0" y="198.0" font-size="30" fill="#1f272e" font-weight="650">50 Hz = 50 volledige trillingen per seconde</text>
<text x="570.0" y="236.0" font-size="25" fill="#4b5661">De stroom wisselt dus 100 keer per seconde van richting.</text>
<rect x="170" y="400" width="97.1" height="50" fill="#f6d9d4"/>
<rect x="267.1" y="400" width="777.1" height="50" fill="#eef1f0"/>
<rect x="1044.3" y="400" width="388.6" height="50" fill="#e3f4f6"/>
<rect x="1190.0" y="400" width="97.1" height="50" fill="#17c15c"/>
<rect x="1432.8" y="400" width="97.2" height="50" fill="#c4e6ec"/>
<text x="655.7" y="433.0" font-size="23" fill="#1f272e" font-weight="600" text-anchor="middle">zakt ze verder: noodmaatregelen</text>
<text x="267.1" y="488.0" font-size="23" fill="#c2412d" font-weight="650" text-anchor="middle">49,0 Hz</text>
<text x="1044.3" y="488.0" font-size="23" fill="#1f272e" font-weight="650" text-anchor="middle">49,8 Hz</text>
<text x="1238.5" y="488.0" font-size="23" fill="#0b7a42" font-weight="650" text-anchor="middle">50 Hz</text>
<text x="1432.8" y="488.0" font-size="23" fill="#1f272e" font-weight="650" text-anchor="middle">50,2 Hz</text>
<text x="170.0" y="305.0" font-size="25" fill="#1f272e" font-weight="650">Meer verbruik dan productie:</text>
<text x="170.0" y="337.0" font-size="23" fill="#4b5661">de frequentie daalt, bijvoorbeeld naar 49,95 Hz</text>
<text x="1530.0" y="305.0" font-size="25" fill="#1f272e" font-weight="650" text-anchor="end">Meer productie dan verbruik:</text>
<text x="1530.0" y="337.0" font-size="23" fill="#4b5661" text-anchor="end">de frequentie stijgt, bijvoorbeeld naar 50,05 Hz</text>
<text x="1238.5" y="385.0" font-size="24" fill="#0b7a42" font-weight="650" text-anchor="middle">Normaal: 50 Hz ± 0,05 Hz</text>
<text x="170.0" y="545.0" font-size="23" fill="#c2412d" font-weight="600">Vanaf 49,0 Hz schakelt België automatisch</text>
<text x="170.0" y="575.0" font-size="23" fill="#c2412d" font-weight="600">verbruik af, in stappen.</text>
<text x="1098.5" y="545.0" font-size="23" fill="#0a6a78" font-weight="600" text-anchor="middle">Bij 49,8 of 50,2 Hz (0,2 Hz afwijking)</text>
<text x="1098.5" y="575.0" font-size="23" fill="#0a6a78" font-weight="600" text-anchor="middle">is de primaire reserve volledig ingezet.</text>
<text x="1530.0" y="625.0" font-size="23" fill="#0a6a78" font-weight="600" text-anchor="end">Boven 50,2 Hz verminderen omvormers van zonnepanelen</text>
<text x="1530.0" y="655.0" font-size="23" fill="#0a6a78" font-weight="600" text-anchor="end">die sinds 2013 geplaatst zijn geleidelijk hun vermogen.</text>
<text x="150.0" y="710.0" font-size="30" fill="#1f272e" font-weight="650">Elia grijpt in met reserves, stap voor stap</text>
<rect x="150" y="730" width="430" height="86" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="365.0" y="769.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">FCR: enkele seconden</text>
<text x="365.0" y="803.0" font-size="22" fill="#4b5661" text-anchor="middle">automatisch, stabiliseert</text>
<rect x="625" y="730" width="430" height="86" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="840.0" y="769.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">aFRR: binnen 7,5 minuten</text>
<text x="840.0" y="803.0" font-size="22" fill="#4b5661" text-anchor="middle">automatisch, terug naar 50 Hz</text>
<rect x="1100" y="730" width="430" height="86" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="1315.0" y="769.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">mFRR: binnen 15 minuten</text>
<text x="1315.0" y="803.0" font-size="22" fill="#4b5661" text-anchor="middle">manueel, grote onevenwichten</text>
<line x1="582" y1="773" x2="618" y2="773" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<line x1="1057" y1="773" x2="1093" y2="773" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<text x="150.0" y="856.0" font-size="22" fill="#4b5661">Bron: Elia, ENTSO-E, Synergrid (C10/11) en Energuide (Sibelga). Vereenvoudigd weergegeven.</text>
