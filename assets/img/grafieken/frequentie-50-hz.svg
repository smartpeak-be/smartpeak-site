<text x="150" y="82" font-size="40" font-weight="650" fill="#1f272e">50 Hz: hoe ver mag de frequentie afwijken?</text>
<text x="150" y="128" font-size="27" fill="#4b5661">Wat er gebeurt op het Europese net als productie en verbruik uit evenwicht raken</text>
