<line x1="1120" y1="700" x2="1362" y2="700" stroke="#0b7a42" stroke-width="5" marker-end="url(#arrow-0b7a42)"/>
<text x="1240.0" y="800.0" font-size="22" fill="#0b7a42" font-weight="600" text-anchor="middle">blijft aan de gelijkstroomkant van je installatie</text>
