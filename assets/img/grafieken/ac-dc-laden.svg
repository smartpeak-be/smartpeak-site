<text x="905.0" y="286.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Verdeelkast</text>
<text x="905.0" y="320.0" font-size="22" fill="#4b5661" text-anchor="middle">huis en net</text>
