<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Instrument Sans, Segoe UI, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="150" y="82" font-size="40" font-weight="650" fill="#1f272e">AC-laden of DC-laden: welke weg gaat de energie?</text>
<text x="150" y="128" font-size="27" fill="#4b5661">Vereenvoudigd schema van een woning met zonnepanelen en een batterij</text>
