<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Instrument Sans, Segoe UI, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="150" y="82" font-size="40" font-weight="650" fill="#1f272e">Welke Zendure-modus past bij jou?</text>
<text x="150" y="128" font-size="27" fill="#4b5661">Je contract bepaalt meestal de beste start; wisselen kan altijd in de app</text>
<defs><marker id="arrow-1f272e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f272e"/></marker></defs>
<text x="150.0" y="192.0" font-size="27" fill="#4b5661" font-weight="600">Welk contract heb je?</text>
<text x="640.0" y="192.0" font-size="27" fill="#4b5661" font-weight="600">Begin met deze modus</text>
<rect x="150" y="215" width="380" height="125" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="340.0" y="273.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Vast contract</text>
<text x="340.0" y="307.5" font-size="22" fill="#4b5661" text-anchor="middle">één prijs, dag en nacht</text>
<line x1="535" y1="277" x2="628" y2="277" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<rect x="640" y="215" width="890" height="125" rx="18" fill="#e9f8ef" stroke="#bfe9cf" stroke-width="3"/>
<text x="1085.0" y="273.5" font-size="27" fill="#0b7a42" font-weight="650" text-anchor="middle">Zelfverbruik</text>
<text x="1085.0" y="307.5" font-size="22" fill="#0b7a42" text-anchor="middle">zonnestroom eerst zelf gebruiken, de batterij laadt enkel met zon</text>
<rect x="150" y="380" width="380" height="125" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="340.0" y="438.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Dag- en nachttarief</text>
<text x="340.0" y="472.5" font-size="22" fill="#4b5661" text-anchor="middle">goedkoper 's nachts</text>
<line x1="535" y1="442" x2="628" y2="442" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<rect x="640" y="380" width="890" height="125" rx="18" fill="#e9f8ef" stroke="#bfe9cf" stroke-width="3"/>
<text x="1085.0" y="438.5" font-size="27" fill="#0b7a42" font-weight="650" text-anchor="middle">Zelfverbruik of TOU</text>
<text x="1085.0" y="472.5" font-size="22" fill="#0b7a42" text-anchor="middle">TOU kan ook in de goedkope uren uit het net laden</text>
<rect x="150" y="545" width="380" height="125" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="340.0" y="603.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Dynamisch contract</text>
<text x="340.0" y="637.5" font-size="22" fill="#4b5661" text-anchor="middle">prijs per uur of kwartier</text>
<line x1="535" y1="607" x2="628" y2="607" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<rect x="640" y="545" width="890" height="125" rx="18" fill="#e9f8ef" stroke="#bfe9cf" stroke-width="3"/>
<text x="1085.0" y="603.5" font-size="27" fill="#0b7a42" font-weight="650" text-anchor="middle">ZENKI of TOU</text>
<text x="1085.0" y="637.5" font-size="22" fill="#0b7a42" text-anchor="middle">ZENKI plant zelf, bij TOU kies je zelf de prijszones</text>
<rect x="150" y="720" width="680" height="95" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="490.0" y="763.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Vaste routine of eigen sturing</text>
<text x="490.0" y="797.5" font-size="22" fill="#4b5661" text-anchor="middle">kies Aangepast: je eigen schema</text>
<rect x="850" y="720" width="680" height="95" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="1190.0" y="763.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Liever niets instellen</text>
<text x="1190.0" y="797.5" font-size="22" fill="#4b5661" text-anchor="middle">kies Auto: beslist zelf, geen extra instellingen</text>
<text x="150.0" y="868.0" font-size="23" fill="#4b5661">Vereenvoudigd. Zelfverbruik, ZENKI en TOU vragen een gekoppelde meter, zoals een P1-lezer op je digitale meter.</text>
</svg>
