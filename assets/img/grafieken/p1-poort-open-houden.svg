<text x="800.0" y="790.0" font-size="25" fill="#1f272e" font-weight="600" text-anchor="middle">Een driehoekje boven P1 (of GP) op je meter: de poort staat open.</text>
<text x="150.0" y="868.0" font-size="21" fill="#4b5661">Vereenvoudigd. Bron: Fluvius (gebruikerspoorten activeren) en eigen ervaring bij klanten.</text>
