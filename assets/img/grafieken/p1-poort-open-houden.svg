<text x="800.0" y="355.0" font-size="22" fill="#4b5661" text-anchor="middle">poortbeheer en meter</text>
<rect x="1090" y="250" width="360" height="150" rx="18" fill="#fdecea" stroke="#f3c7c0" stroke-width="3"/>
<text x="1270.0" y="321.0" font-size="27" fill="#c2412d" font-weight="650" text-anchor="middle">Dicht?</text>
<text x="1270.0" y="355.0" font-size="22" fill="#c2412d" text-anchor="middle">opnieuw aanvragen</text>
