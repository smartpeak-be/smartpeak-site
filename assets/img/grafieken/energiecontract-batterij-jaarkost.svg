<text x="150" y="82" font-size="40" font-weight="650" fill="#1f272e">Eén woning, vier contracten: de jaarkost met en zonder batterij</text>
<text x="150" y="128" font-size="25" fill="#4b5661">De batterij bespaart het meest bij het duurste contract, maar daar blijft de factuur ook het hoogst</text>
