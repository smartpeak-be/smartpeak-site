<text x="150.0" y="850.0" font-size="20" fill="#4b5661">Berekening SmartPeak op kwartierwaarden van één woning (okt. 2025 – sep. 2026), Belpex-kwartierprijzen en tariefformules 2027.</text>
<text x="150.0" y="878.0" font-size="20" fill="#4b5661">Batterij 7,6 kWh en 4 kW op eigenverbruik. Energiedeel + variabele netkosten per kWh, incl. 6% btw, zonder capaciteitstarief. Afgerond.</text>
