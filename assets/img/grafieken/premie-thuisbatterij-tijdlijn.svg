<text x="1325.0" y="202.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Premieloket definitief dicht</text>
<text x="1325.0" y="234.0" font-size="22" fill="#4b5661" text-anchor="middle">geen dossiers meer</text>
<line x1="500.0" x2="500.0" y1="540" y2="568" stroke="#0b7a42" stroke-width="3"/>
<circle cx="500.0" cy="480" r="12" fill="#17c15c"/>
<text x="500.0" y="600.0" font-size="22" fill="#0b7a42" font-weight="600" text-anchor="middle">1 januari 2021</text>
<text x="500.0" y="632.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Geen terugdraaiende teller</text>
<text x="500.0" y="664.0" font-size="22" fill="#4b5661" text-anchor="middle">voor nieuwe zonnepanelen</text>
<line x1="800.0" x2="800.0" y1="540" y2="668" stroke="#0b7a42" stroke-width="3"/>
<circle cx="800.0" cy="480" r="12" fill="#17c15c"/>
<text x="800.0" y="700.0" font-size="22" fill="#0b7a42" font-weight="600" text-anchor="middle">1 januari 2023</text>
<text x="800.0" y="732.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Capaciteitstarief</text>
<text x="800.0" y="764.0" font-size="22" fill="#4b5661" text-anchor="middle">je maandpiek telt mee</text>
<line x1="1377.5" x2="1377.5" y1="540" y2="568" stroke="#0b7a42" stroke-width="3"/>
<circle cx="1377.5" cy="480" r="12" fill="#17c15c"/>
<text x="1377.5" y="600.0" font-size="22" fill="#0b7a42" font-weight="600" text-anchor="middle">begin november 2026</text>
<text x="1377.5" y="632.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">195.288 thuisbatterijen</text>
<text x="1377.5" y="664.0" font-size="22" fill="#4b5661" text-anchor="middle">geregistreerd in Vlaanderen</text>
<text x="150.0" y="178.0" font-size="23" fill="#4b5661" font-weight="600">Boven de lijn: de premie</text>
<text x="150.0" y="818.0" font-size="23" fill="#0b7a42" font-weight="600">Onder de lijn: wat een batterij om andere redenen interessanter maakte</text>
<text x="150.0" y="862.0" font-size="21" fill="#4b5661">Bron: Vlaanderen.be, VRT NWS, Vlaamse Nutsregulator; aantal volgens Solar &amp; Storage Magazine, op basis van cijfers van Fluvius.</text>
</svg>
