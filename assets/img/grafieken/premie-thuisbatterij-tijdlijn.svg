<text x="837.5" y="202.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Laatste keuringsdatum</text>
<text x="837.5" y="234.0" font-size="22" fill="#4b5661" text-anchor="middle">voor de premie</text>
<line x1="1088.0" x2="1088.0" y1="400" y2="480" stroke="#4b5661" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="1088.0" cy="480" r="12" fill="#ffffff" stroke="#4b5661" stroke-width="5"/>
<text x="1088.0" y="300.0" font-size="22" fill="#4b5661" font-weight="600" text-anchor="middle">1 december 2024</text>
