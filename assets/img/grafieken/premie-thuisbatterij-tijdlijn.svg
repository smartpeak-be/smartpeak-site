<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Instrument Sans, Segoe UI, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="150" y="82" font-size="40" font-weight="650" fill="#1f272e">De premie verdween, de batterij bleef</text>
<text x="150" y="128" font-size="27" fill="#4b5661">Vlaamse premie voor een thuisbatterij en wat er intussen veranderde, 2019 tot 2026</text>
<line x1="160" x2="1460" y1="480" y2="480" stroke="#1f272e" stroke-width="4"/>
<line x1="200.0" x2="200.0" y1="470" y2="490" stroke="#1f272e" stroke-width="3"/>
