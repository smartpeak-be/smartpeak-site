<text x="1088.0" y="364.0" font-size="22" fill="#4b5661" text-anchor="middle">geen nieuwe aanvragen</text>
<line x1="1325.0" x2="1325.0" y1="270" y2="480" stroke="#4b5661" stroke-width="3" stroke-dasharray="6 6"/>
