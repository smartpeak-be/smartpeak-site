<line x1="287.0" x2="287.0" y1="320" y2="480" stroke="#4b5661" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="287.0" cy="480" r="12" fill="#ffffff" stroke="#4b5661" stroke-width="5"/>
<text x="287.0" y="220.0" font-size="22" fill="#4b5661" font-weight="600" text-anchor="middle">1 augustus 2019</text>
<text x="287.0" y="252.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Premie start</text>
<text x="287.0" y="284.0" font-size="22" fill="#4b5661" text-anchor="middle">250 €/kWh, max. 3.200 €</text>
<line x1="837.5" x2="837.5" y1="270" y2="480" stroke="#4b5661" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="837.5" cy="480" r="12" fill="#ffffff" stroke="#4b5661" stroke-width="5"/>
