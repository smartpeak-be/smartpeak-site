<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Instrument Sans, Segoe UI, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="150" y="82" font-size="40" font-weight="650" fill="#1f272e">Wat doet je omvormer op een zonnige dag?</text>
<text x="150" y="128" font-size="27" fill="#4b5661">Wat je niet meteen gebruikt, gaat naar het net, en dat is veel minder waard dan zelf gebruiken</text>
<defs><marker id="arrow-1f272e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f272e"/></marker></defs>
<rect x="150" y="215" width="300" height="120" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="300.0" y="271.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Zonnepanelen</text>
<text x="300.0" y="305.0" font-size="22" fill="#4b5661" text-anchor="middle">20 kWh die dag</text>
<rect x="560" y="215" width="300" height="120" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="710.0" y="271.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Omvormer</text>
<text x="710.0" y="305.0" font-size="22" fill="#4b5661" text-anchor="middle">gelijk- naar wisselstroom</text>
<rect x="960" y="170" width="420" height="100" rx="18" fill="#e9f8ef" stroke="#bfe9cf" stroke-width="3"/>
<text x="1170.0" y="216.0" font-size="27" fill="#0b7a42" font-weight="650" text-anchor="middle">Huis</text>
<text x="1170.0" y="250.0" font-size="22" fill="#0b7a42" text-anchor="middle">6 kWh meteen zelf gebruikt</text>
<rect x="960" y="290" width="420" height="100" rx="18" fill="#eef1f0" stroke="#e3ebe8" stroke-width="3"/>
<text x="1170.0" y="336.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Net</text>
<text x="1170.0" y="370.0" font-size="22" fill="#4b5661" text-anchor="middle">14 kWh geïnjecteerd</text>
<line x1="450" y1="275" x2="552" y2="275" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<line x1="860" y1="262" x2="952" y2="222" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<line x1="860" y1="290" x2="952" y2="340" stroke="#1f272e" stroke-width="5" marker-end="url(#arrow-1f272e)"/>
<text x="150.0" y="450.0" font-size="30" fill="#1f272e" font-weight="650">Wat is die 14 kWh waard?</text>
<rect x="150" y="475" width="660" height="96" rx="18" fill="#eef1f0" stroke="#e3ebe8" stroke-width="3"/>
<text x="480.0" y="519.0" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">14 kWh injecteren</text>
<text x="480.0" y="553.0" font-size="22" fill="#4b5661" text-anchor="middle">levert ongeveer € 0,42 op</text>
<text x="840.0" y="534.0" font-size="26" fill="#4b5661" font-weight="600" text-anchor="middle">of</text>
<rect x="870" y="475" width="660" height="96" rx="18" fill="#e9f8ef" stroke="#bfe9cf" stroke-width="3"/>
<text x="1200.0" y="519.0" font-size="27" fill="#0b7a42" font-weight="650" text-anchor="middle">Diezelfde 14 kWh later zelf gebruiken</text>
<text x="1200.0" y="553.0" font-size="22" fill="#0b7a42" text-anchor="middle">vermijdt ongeveer € 4,20 aan afname</text>
<text x="150.0" y="640.0" font-size="30" fill="#1f272e" font-weight="650">Wanneer injecteert je omvormer minder of niets?</text>
<rect x="150" y="665" width="440" height="105" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="370.0" y="713.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Te hoge netspanning</text>
<text x="370.0" y="747.5" font-size="22" fill="#4b5661" text-anchor="middle">hij schakelt automatisch af</text>
<rect x="620" y="665" width="440" height="105" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="840.0" y="713.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Injectiebegrenzing</text>
<text x="840.0" y="747.5" font-size="22" fill="#4b5661" text-anchor="middle">bijvoorbeeld na een netstudie</text>
<rect x="1090" y="665" width="440" height="105" rx="18" fill="#f3f7f5" stroke="#e3ebe8" stroke-width="3"/>
<text x="1310.0" y="713.5" font-size="27" fill="#1f272e" font-weight="650" text-anchor="middle">Sturing op prijs</text>
<text x="1310.0" y="747.5" font-size="22" fill="#4b5661" text-anchor="middle">bij een negatieve prijs</text>
<text x="150.0" y="826.0" font-size="21" fill="#4b5661">Voorbeeld met fictieve waarden: 30 cent per kWh afname en 3 cent per kWh injectie; opslagverliezen en capaciteitstarief</text>
<text x="150.0" y="852.0" font-size="21" fill="#4b5661">zijn niet meegerekend. De redenen om minder te injecteren, met hun bronnen, staan in het artikel.</text>
</svg>
