<text x="1530.0" y="660.0" font-size="23" fill="#0b7a42" font-weight="600" text-anchor="end">10% bij de 10 goedkoopste producten</text>
<text x="150.0" y="850.0" font-size="22" fill="#4b5661">Bron: CREG, studie F3188 (12 maart 2026), lopende contracten van Belgische gezinnen op 30 september 2025.</text>
<text x="150.0" y="880.0" font-size="22" fill="#4b5661">De rest van de markt is het verschil met 100%.</text>
