<text x="1477.3" y="324.0" font-size="34" fill="#ffffff" font-weight="700" text-anchor="middle">9%</text>
<text x="1530.0" y="410.0" font-size="23" fill="#0b7a42" font-weight="600" text-anchor="end">9% bij de 10 goedkoopste producten</text>
<text x="150.0" y="570.0" font-size="30" fill="#1f272e" font-weight="650">Aardgas</text>
<rect x="360.0" y="500" width="748.8" height="120" fill="#c2412d"/>
<text x="734.4" y="562.0" font-size="34" fill="#ffffff" font-weight="700" text-anchor="middle">64%</text>
<text x="734.4" y="596.0" font-size="22" fill="#ffffff" text-anchor="middle">bij de 10 duurste</text>
<rect x="1108.8" y="500" width="304.2" height="120" fill="#dfe6e3"/>
<text x="1260.9" y="562.0" font-size="34" fill="#1f272e" font-weight="700" text-anchor="middle">26%</text>
<text x="1260.9" y="596.0" font-size="22" fill="#1f272e" text-anchor="middle">de rest van de markt</text>
