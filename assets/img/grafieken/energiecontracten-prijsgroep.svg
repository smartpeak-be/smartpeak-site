<rect x="360.0" y="250" width="596.7" height="120" fill="#c2412d"/>
<text x="658.4" y="312.0" font-size="34" fill="#ffffff" font-weight="700" text-anchor="middle">51%</text>
<text x="658.4" y="346.0" font-size="22" fill="#ffffff" text-anchor="middle">bij de 10 duurste</text>
<rect x="956.7" y="250" width="468.0" height="120" fill="#dfe6e3"/>
<text x="1190.7" y="312.0" font-size="34" fill="#1f272e" font-weight="700" text-anchor="middle">40%</text>
<text x="1190.7" y="346.0" font-size="22" fill="#1f272e" text-anchor="middle">de rest van de markt</text>
