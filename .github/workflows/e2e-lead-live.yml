name: Live test battery analysis (creates a TEST lead)
# Manual only. Walks through the live lead wizard once with the Fluvius test file from
# battery-roi-tool, creates a real lead named "TEST ..." and sends a real result mail.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Address that receives the test result mail"
        default: "kevin@smartpeak.be"
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Get the Fluvius test file
        run: git clone --depth 1 https://github.com/smartpeak-be/battery-roi-tool /tmp/roi
      - name: Install Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run the wizard
        run: python tools/e2e_lead_live.py /tmp/roi/e2e/fixtures/test-fluvius.csv "${{ inputs.email }}"
      - name: Store screenshots and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add content/e2e-lead
          git diff --cached --quiet && exit 0
          git commit -m "Live lead wizard test result"
          git push
