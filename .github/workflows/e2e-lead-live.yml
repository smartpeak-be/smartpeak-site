name: Live test battery analysis
# Manual only. Mode "embed-check" (default) checks the analysis embedded on the published
# site up to the submit button: no lead, no mail. Mode "wizard" walks through lead.html once
# with the Fluvius test file and creates a real lead named "TEST ..." with a real result mail.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "embed-check (no lead) or wizard (creates a TEST lead)"
        type: choice
        options: [embed-check, wizard]
        default: embed-check
      email:
        description: "Address that receives the test result mail"
        default: "kevin@smartpeak.be"
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Get the Fluvius test file
        run: git clone --depth 1 https://github.com/smartpeak-be/battery-roi-tool /tmp/roi
      - name: Install Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check the embedded analysis (no lead)
        if: inputs.mode == 'embed-check'
        run: python tools/e2e_embed_check.py /tmp/roi/e2e/fixtures/test-fluvius.csv
      - name: Run the wizard (creates a TEST lead)
        if: inputs.mode == 'wizard'
        run: python tools/e2e_lead_live.py /tmp/roi/e2e/fixtures/test-fluvius.csv "${{ inputs.email }}"
      - name: Store screenshots and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add content/e2e-lead
          git diff --cached --quiet && exit 0
          git commit -m "Live lead wizard test result"
          git pull --rebase origin main && git push
