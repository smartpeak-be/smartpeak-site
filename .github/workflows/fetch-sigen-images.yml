name: Fetch Sigenergy product images
# Manual only: collects the product images from sigenergy.com into content/product-images-raw/sigenergy/.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect images
        run: python tools/fetch_sigen_images.py
      - name: Commit images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add content/product-images-raw/sigenergy
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fetch Sigenergy product images"
          git pull --rebase origin main && git push
