name: Import WordPress content
# Manual only: pulls posts, pages and images from the current smartpeak.be WordPress
# into content/wordpress/ and commits them, together with import.log.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download WordPress content
        run: |
          mkdir -p content/wordpress
          set -o pipefail
          python3 tools/import_wordpress.py 2>&1 | tee content/wordpress/import.log
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add content/wordpress
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Import WordPress content from smartpeak.be"
          git push
