name: Mirror datasheets and product images
# Manual only: stores the PDFs from content/documents.json in assets/docs/ and commits them.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Download all documents again, also the ones already stored"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download datasheets
        run: |
          mkdir -p assets/docs
          set -o pipefail
          python3 tools/mirror_documents.py ${{ inputs.refresh && '--refresh' || '' }} 2>&1 | tee content/documents-mirror.log
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/docs content/product-images-raw content/documents-mirror.log
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Mirror datasheets"
          git push
