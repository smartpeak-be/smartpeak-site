name: Deploy website to GitHub Pages
# One short job per push to main: build, check links, deploy. Docs-only changes skip it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "content/wordpress/**"
      - "tools/import_wordpress.py"
      - "tools/convert_wordpress.py"
      - "tools/mirror_documents.py"
      - "content/documents.json"
      - "content/documents-mirror.log"
      - "content/product-images.json"
      - "content/product-images-raw/**"
      - ".github/workflows/mirror-documents.yml"
      - ".github/workflows/import-wordpress.yml"
      - ".github/workflows/test-contact-form.yml"
      - "tools/test_contact_lead.mjs"
      - "content/contact-form-test.log"
      - "content/e2e-lead/**"
      - "tools/e2e_lead_live.py"
      - ".github/workflows/e2e-lead-live.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build.py
      - name: Check links and SEO basics
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
